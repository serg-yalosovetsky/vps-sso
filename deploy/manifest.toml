# Как раскатывается vps-sso. Читает meshdeploy
# (https://forgejo.ibotz.fun/serg/meshdeploy).
#
# Первый сервис в раскатке, где между исходником и работающим кодом стоит
# НАСТОЯЩАЯ сборка: Next.js отдаёт не файлы репозитория, а бандл из .next.
# Поэтому одного «HEAD == целевая ревизия» здесь мало — он говорит про
# исходник, а работать может прежняя сборка.

service = "vps-sso"
kind    = "systemd"
repo    = "https://github.com/serg-yalosovetsky/vps-sso"

# ring 1: это единый вход для сайтов меша. Его рестарт видят все, кто в этот
# момент логинится, — обычным сервисом он не является.
ring = 1

[hosts.vps]
path = "/root/vps-sso"
unit = "vps-sso.service"

[env]
# Секреты сервис достаёт сам в run.sh: MESH_TOKEN из Bitwarden SM, дальше
# JWT_SECRET, CLERK_SECRET_KEY, INTERNAL_SECRET и DSN — из secrets-gateway,
# несекретный конфиг — из config-store, .env остаётся фолбэком.
#
# Имена здесь НЕ объявлены намеренно: pre-flight проверяет наличие ключей в
# шлюзе, а этот сервис спроектирован переживать недоступность шлюза (падает на
# .env). Отказ раскатки из-за временно недоступного шлюза был бы строже, чем
# сам сервис.
secret_names = []

[build]
# Путь абсолютный: PATH приёмника не содержит nvm, а node тут поставлен им.
# Проверено пробным прогоном 22.09.2026: сборка проходит за 121 секунду,
# BUILD_ID меняется, сервис при этом продолжает работать на прежнем процессе.
cmd = ["/root/.nvm/versions/node/v22.22.3/bin/npm", "run", "build"]

[activate]
restart = ["vps-sso.service"]

# Файл, который сборка ОБЯЗАНА обновить. Без этой проверки прогон был бы
# зелёным и в случае, когда `next build` не дошёл до записи бандла: рестарт
# прошёл бы, страница ответила бы 200 со СТАРОЙ сборки, HEAD сошёлся бы.
# BUILD_ID меняется при каждой успешной сборке — это и есть монотонная отметка.
artifact = ".next/BUILD_ID"

[health]
# Корень отдаёт 404 (маршрута нет), это нормальное состояние приложения.
# Проверяем страницу входа — то, ради чего сервис существует.
# Адрес IPv6: сервер слушает только [::1], по 127.0.0.1 не отвечает вовсе.
url           = "http://[::1]:3010/sign-in"
expect_status = 200
# Маркер из отрендеренной страницы: 200 может вернуть и заглушка прокси, а этот
# заголовок печатает само приложение.
body_contains = "<title>SSO</title>"
timeout_s     = 90
