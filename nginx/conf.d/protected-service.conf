# Template for protecting a service behind SSO.
# Copy this file, replace service1.example.com and SERVICE_PORT, then reload nginx.
#
# SECURITY: The upstream service MUST bind to 127.0.0.1 only (not 0.0.0.0).
# Anyone who reaches the service port directly can forge X-Forwarded-User headers
# and impersonate any user. Verify with: ss -tlnp | grep SERVICE_PORT
#
# How it works:
#   1. nginx sends an internal subrequest to /sso-auth on every request
#   2. /sso-auth proxies to the Next.js SSO service /api/auth/check
#   3. On 200 → pass through; on 401 → redirect browser to sign-in
#   4. After login the SSO callback sets sso_token cookie on .example.com
#   5. nginx forwards X-Forwarded-User/Email headers to the upstream service
#      (Grafana, Portainer, etc. can use these for trusted-header auth)

upstream sso_backend {
    server 127.0.0.1:3000;
    keepalive 32;
}

server {
    listen 80;
    server_name service1.example.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name service1.example.com;

    ssl_certificate     /etc/letsencrypt/live/service1.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/service1.example.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    # Internal auth subrequest — never exposed to the outside world
    location = /sso-auth {
        internal;
        proxy_pass              http://sso_backend/api/auth/check;
        proxy_pass_request_body off;
        proxy_set_header        Content-Length   "";
        proxy_set_header        X-Original-URI   $request_uri;
        proxy_set_header        Cookie           $http_cookie;
        proxy_set_header        Authorization    $http_authorization;
        # Shared secret so the SSO service knows the request came from nginx
        proxy_set_header        X-Internal-Secret "REPLACE_WITH_INTERNAL_SECRET";
        proxy_cache_bypass      1;
        proxy_no_cache          1;
    }

    location / {
        auth_request /sso-auth;

        # Capture user info from auth response headers
        auth_request_set $auth_user  $upstream_http_x_auth_user;
        auth_request_set $auth_email $upstream_http_x_auth_email;
        auth_request_set $auth_name  $upstream_http_x_auth_name;

        error_page 401 = @sso_login;

        # Forward identity to the upstream service
        proxy_set_header X-Forwarded-User               $auth_email;
        proxy_set_header X-Forwarded-Email              $auth_email;
        proxy_set_header X-Forwarded-Preferred-Username $auth_name;
        proxy_set_header Remote-User                    $auth_email;

        proxy_pass         http://127.0.0.1:SERVICE_PORT;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }

    # Redirect unauthenticated browsers to the SSO login page,
    # preserving the original URL so the user lands back here after login.
    location @sso_login {
        return 302 https://sso.example.com/sign-in?redirect_url=$scheme://$host$request_uri;
    }
}
