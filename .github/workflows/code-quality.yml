name: code-quality
# Annotate-only: находки появляются аннотациями и сборку НЕ блокируют. Блокирующие
# проверки (типы, oxlint, тесты, ruff) живут в ci.yml.
#
# Центральные конфиги codehealth и SonarQube — это инфраструктура владельца. В
# форке их нет, и раньше их недоступность валила весь прогон: curl -f на 502 от
# codehealth.ibotz.fun завершал шаг кодом 22 (прогоны 22–23.09.2026). Теперь их
# отсутствие честно пишется в лог предупреждением, а не роняет и не маскируется.
on:
  push:
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    env:
      CODEHEALTH_TOKEN: ${{ secrets.CODEHEALTH_INGEST_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - name: ruff (annotate)
        if: hashFiles('**/*.py') != ''
        run: |
          pipx install ruff
          cfg=()
          if [ -n "$CODEHEALTH_TOKEN" ] && curl -fsS -m 20 -H "Authorization: Bearer $CODEHEALTH_TOKEN" \
               https://codehealth.ibotz.fun/api/config/ruff.toml -o /tmp/ruff.toml; then
            cfg=(--config /tmp/ruff.toml)
          else
            echo "::warning::центральный ruff.toml недоступен — ruff с настройками по умолчанию"
          fi
          ruff check "${cfg[@]}" --output-format=github . || true

      - name: shellcheck (annotate)
        if: hashFiles('**/*.sh','**/*.bash') != ''
        run: |
          find . -type f \( -name '*.sh' -o -name '*.bash' \) -not -path '*/.git/*' -not -path '*/node_modules/*' -print0 \
            | xargs -0 -r shellcheck -f gcc -S warning -e SC1090,SC1091,SC2154 || true

  sonar:
    runs-on: ubuntu-latest
    env:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
    steps:
      - name: SonarQube не настроен
        if: env.SONAR_TOKEN == ''
        run: echo "::notice::SONAR_TOKEN не задан — скан SonarQube пропущен (это не успех скана)"

      - uses: actions/checkout@v4
        if: env.SONAR_TOKEN != ''
        with:
          fetch-depth: 0
      - id: key
        if: env.SONAR_TOKEN != ''
        name: lowercase project key (match codehealth canonical name)
        run: echo "k=$(echo '${{ github.event.repository.name }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-node@v4
        if: env.SONAR_TOKEN != ''
        with:
          node-version: '22'
          cache: npm
      - name: tests + coverage (для Sonar)
        if: env.SONAR_TOKEN != ''
        run: |
          npm ci
          npx vitest run --coverage.enabled --coverage.reporter=lcov --coverage.provider=v8 \
            || echo "::warning::покрытие не собрано — Sonar получит скан без coverage"

      - name: SonarQube scan
        if: env.SONAR_TOKEN != ''
        uses: SonarSource/sonarqube-scan-action@v4
        env:
          SONAR_HOST_URL: https://sonar.ibotz.fun
        with:
          args: >
            -Dsonar.projectKey=${{ steps.key.outputs.k }}
            -Dsonar.sources=.
            -Dsonar.exclusions=**/node_modules/**,**/.next/**,**/coverage/**,**/*.min.js
            -Dsonar.javascript.lcov.reportPaths=coverage/lcov.info
